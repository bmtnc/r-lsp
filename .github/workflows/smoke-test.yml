name: smoke-test

# The wrapper patches internals of the languageserver R package, which can
# change in any release. The weekly run catches a breaking release even when
# this repository has not changed.
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::languageserver
            any::lintr
            any::renv
            any::tidyverse
            any::testthat

      - name: Installed versions
        run: Rscript -e 'for (p in c("languageserver", "lintr", "renv", "dplyr", "purrr")) cat(p, format(packageVersion(p)), "\n")'

      - name: Smoke test
        run: python3 tests/smoke_test.py
