name: smoke-test

# The wrapper patches internals of the languageserver R package, which can
# change in any release. The weekly run catches a breaking release even when
# this repository has not changed. A scenario whose packages are missing is
# a failure here (--no-skip), so a package that fails to install cannot turn
# the run green. The hooks promise macOS (bash 3.2, BSD tools): the macOS
# job runs every scenario that does not start the server.
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::languageserver
            any::lintr
            any::renv
            any::tidyverse
            any::testthat
            any::arrow
            any::pkgload

      - name: Installed versions
        run: Rscript -e 'for (p in c("languageserver", "lintr", "renv", "dplyr", "purrr", "arrow")) cat(p, format(packageVersion(p)), "\n")'

      - name: Shell scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -s bash -S warning plugins/r-lsp/hooks/*.sh plugins/r-lsp/scripts/project-root.sh plugins/r-lsp/bin/r-colcheck plugins/r-lsp/bin/r-colmap plugins/r-lsp/bin/r-callmap plugins/r-lsp/bin/r-lint plugins/r-lsp/bin/r-lsp-status plugins/r-lsp/bin/r-lsp-wrapper

      - name: Smoke test
        run: python3 tests/smoke_test.py --no-skip

  smoke-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::lintr
            any::renv
            any::dplyr
            any::tidyr
            any::purrr
            any::readr
            any::data.table
            any::testthat
            any::pkgload

      # every scenario that does not start the language server: the hooks,
      # the checker and its cache, the linters, the maps and the tools' arguments
      - name: Hooks, checker, linters and maps on macOS (bash 3.2, BSD tools)
        run: |
          python3 tests/smoke_test.py --no-skip -k hooks_changes
          python3 tests/smoke_test.py --no-skip -k hooks_dormant
          python3 tests/smoke_test.py --no-skip -k colcheck
          python3 tests/smoke_test.py --no-skip -k results_cache
          python3 tests/smoke_test.py --no-skip -k lint_fallback
          python3 tests/smoke_test.py --no-skip -k callmap
          python3 tests/smoke_test.py --no-skip -k colmap
